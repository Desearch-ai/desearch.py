name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  # Publishes a tag that is already pushed, e.g. after a failed upload. The run
  # uses this workflow from the branch it is started on, but builds the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v1.11.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
    - name: Check out the code
      uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ env.TAG_NAME }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'  # Specify your Python version

    - name: Verify tag matches package version
      run: |
        python3 - <<'PY'
        import os
        import re
        import sys

        tag = os.environ["TAG_NAME"]
        tag_version = tag[1:] if tag.startswith("v") else tag

        with open("desearch_py/__init__.py", encoding="utf-8") as f:
            content = f.read()
        match = re.search(
            r'^__version__\s*=\s*["\']([^"\']+)["\']', content, re.MULTILINE
        )
        if not match:
            print("::error::Unable to find __version__ in desearch_py/__init__.py")
            sys.exit(1)

        version = match.group(1)
        if tag_version != version:
            print(
                f"::error::Tag {tag} does not match __version__ {version} "
                f"in desearch_py/__init__.py"
            )
            sys.exit(1)

        print(f"Tag {tag} matches __version__ {version}")
        PY

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine

    - name: Build
      run: |
        python setup.py sdist bdist_wheel
        twine check dist/*

    - name: Upload distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  # Trusted publishing: PyPI accepts this job's OIDC token instead of an API
  # token. The publisher registered on PyPI must name this repository,
  # publish.yml and the prod environment. Only this job gets id-token: write,
  # so the build steps never hold the token.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download distribution packages
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
