name: Publish to PyPI

on:
  push:
    branches:
      - main  # Change this to your desired branch

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod

    steps:
    - name: Check out the code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'  # Specify your Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine aiohttp "pydantic>=2" typing-extensions

    - name: Run tests
      run: python -m unittest discover -s tests

    - name: Build distributions
      run: |
        rm -rf dist build
        python setup.py sdist bdist_wheel

    - name: Refuse upload unless artifacts match pyproject.toml, __version__, and CHANGELOG.md
      run: |
        python - <<'PY'
        import sys
        import tarfile
        import zipfile
        from pathlib import Path

        sys.path.insert(0, str(Path.cwd()))

        def poetry_field(field: str) -> str:
            section = None
            found = []
            for raw in Path("pyproject.toml").read_text().splitlines():
                line = raw.split("#", 1)[0].strip()
                if line.startswith("[") and line.endswith("]"):
                    section = line[1:-1].strip()
                    continue
                if section != "tool.poetry" or "=" not in line:
                    continue
                key, value = line.split("=", 1)
                if key.strip() == field:
                    found.append(value.strip().strip('"').strip("'"))
            if len(found) != 1 or not found[0]:
                sys.exit(f"refusing upload: expected one pyproject.toml {field}, found {found!r}")
            return found[0]

        def package_version():
            import desearch_py

            if not hasattr(desearch_py, "__version__"):
                return None
            return desearch_py.__version__

        def changelog_has_heading(version: str) -> bool:
            path = Path("CHANGELOG.md")
            if not path.is_file():
                return False
            for raw in path.read_text().splitlines():
                line = raw.strip()
                if not line.startswith("#"):
                    continue
                heading = line.lstrip("#").strip()
                if not heading:
                    continue
                token = heading.split()[0].strip("[]")
                if token == version:
                    return True
            return False

        def metadata_texts(path: Path):
            if path.name.endswith(".tar.gz"):
                with tarfile.open(path) as archive:
                    members = [item for item in archive.getmembers() if item.name.endswith("/PKG-INFO")]
                    if not members:
                        sys.exit(f"refusing upload: {path.name} has no PKG-INFO")
                    texts = []
                    for member in members:
                        extracted = archive.extractfile(member)
                        if extracted is None:
                            sys.exit(f"refusing upload: {path.name} PKG-INFO is unreadable")
                        texts.append(extracted.read().decode())
                    return texts
            if path.name.endswith(".whl"):
                with zipfile.ZipFile(path) as archive:
                    names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
                    if len(names) != 1:
                        sys.exit(f"refusing upload: {path.name} has {len(names)} METADATA files")
                    return [archive.read(names[0]).decode()]
            sys.exit(f"refusing upload: unexpected artifact {path.name}")

        def field(text: str, label: str):
            return [
                line.split(":", 1)[1].strip()
                for line in text.splitlines()
                if line.startswith(label + ":")
            ]

        def filename_version(path: Path) -> str:
            if path.name.endswith(".tar.gz"):
                return path.name[: -len(".tar.gz")].rsplit("-", 1)[1]
            parts = path.name[: -len(".whl")].split("-")
            if len(parts) < 2:
                sys.exit(f"refusing upload: cannot read version from {path.name}")
            return parts[1]

        version = poetry_field("version")
        code_version = package_version()
        if code_version is not None and code_version != version:
            sys.exit(
                "refusing upload: desearch_py.__version__ "
                f"{code_version!r} != pyproject.toml {version!r}"
            )
        if not changelog_has_heading(version):
            sys.exit(f"refusing upload: CHANGELOG.md has no heading for {version}")

        files = sorted(path for path in Path("dist").iterdir() if path.is_file())
        sdists = [path for path in files if path.name.endswith(".tar.gz")]
        wheels = [path for path in files if path.name.endswith(".whl")]
        if len(files) != 2 or len(sdists) != 1 or len(wheels) != 1:
            sys.exit(
                "refusing upload: expected one sdist and one wheel, "
                f"found {[path.name for path in files]!r}"
            )
        for path in files:
            if filename_version(path) != version:
                sys.exit(
                    f"refusing upload: {path.name} filename version is not {version}"
                )
            for text in metadata_texts(path):
                versions = field(text, "Version")
                if versions != [version]:
                    sys.exit(f"refusing upload: {path.name} version is {versions!r}, expected {version!r}")
        print(f"version gate passed: {version}")
        PY

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        set -euo pipefail
        rm -f /tmp/skip-pypi-upload
        python - <<'PY'
        import os
        import re
        import sys
        import urllib.error
        import urllib.request
        from pathlib import Path

        section = None
        names = []
        versions = []
        for raw in Path("pyproject.toml").read_text().splitlines():
            line = raw.split("#", 1)[0].strip()
            if line.startswith("[") and line.endswith("]"):
                section = line[1:-1].strip()
                continue
            if section != "tool.poetry" or "=" not in line:
                continue
            key, value = line.split("=", 1)
            value = value.strip().strip('"').strip("'")
            if key.strip() == "name":
                names.append(value)
            elif key.strip() == "version":
                versions.append(value)
        if len(names) != 1 or len(versions) != 1 or not names[0] or not versions[0]:
            sys.exit(f"refusing upload: expected one pyproject name and version, found {names!r} {versions!r}")
        name = re.sub(r"[-_.]+", "-", names[0]).lower()
        version = versions[0]
        url = f"https://pypi.org/pypi/{name}/{version}/json"
        request = urllib.request.Request(url, method="GET")
        try:
            with urllib.request.urlopen(request, timeout=60) as response:
                code = response.status
        except urllib.error.HTTPError as exc:
            code = exc.code
        if code == 200:
            Path("/tmp/skip-pypi-upload").write_text("exists\n")
            print(f"{name} {version} already exists on PyPI; skipping upload")
        elif code == 404:
            print(f"{name} {version} is not on PyPI; uploading")
        else:
            sys.exit(f"refusing upload: PyPI version check returned HTTP {code}")
        PY
        if [ -f /tmp/skip-pypi-upload ]; then
          exit 0
        fi
        twine upload dist/*
