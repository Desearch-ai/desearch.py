name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  # publish.yml calls this workflow so a failing suite blocks the PyPI upload.
  workflow_call:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and runtime dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run tests
      run: python -m unittest discover -s tests -v
